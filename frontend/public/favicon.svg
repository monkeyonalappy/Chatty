<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
    
    <!-- Inner Glow/Shadow for Bubble -->
    <filter id="bubbleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#475569" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rounded Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Secondary Accent Bubble (Behind) -->
  <path d="M 340 150 
           A 60 60 0 0 0 220 150 
           A 60 60 0 0 0 340 150 Z" 
        fill="#FFFFFF" 
        opacity="0.25" />
  
  <circle cx="350" cy="140" r="45" fill="#FFFFFF" opacity="0.2" />

  <!-- Main Chat Bubble with Tail -->
  <g filter="url(#shadow)">
    <!-- Chat Bubble Shape -->
    <path d="M 140 120 
             L 372 120 
             A 52 52 0 0 1 424 172 
             L 424 292 
             A 52 52 0 0 1 372 344 
             L 220 344 
             L 132 412 
             C 120 421 104 412 104 396 
             L 104 344 
             A 52 52 0 0 1 88 292 
             L 88 172 
             A 52 52 0 0 1 140 120 Z" 
          fill="url(#bubbleGrad)" 
          filter="url(#bubbleShadow)" />

    <!-- Modern Animated / Dynamic Typing Indicator Dots -->
    <circle cx="184" cy="232" r="22" fill="#6366F1" />
    <circle cx="256" cy="232" r="22" fill="#8B5CF6" />
    <circle cx="328" cy="232" r="22" fill="#D946EF" />
  </g>
</svg>